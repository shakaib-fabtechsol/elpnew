name: Deploy to VPS

# Two sites, one per branch, each with its own folder, database and API:
#   main -> https://yandslaw.com     /var/www/elpnew      PM2 elpnew-api     port 8002
#   ai   -> https://ai.yandslaw.com  /var/www/elpnew-ai   PM2 elpnew-ai-api  port 8003
on:
  push:
    branches: [main, ai]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Everything is built ON THE SERVER, from that site's own clone of the
      # repo: nginx serves <folder>/dist and sends /api to the Laravel API
      # (PM2) - so this is a single SSH step.
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            case "$BRANCH" in
              main) APP_DIR=/var/www/elpnew;    API=elpnew-api;    PORT=8002 ;;
              ai)   APP_DIR=/var/www/elpnew-ai; API=elpnew-ai-api; PORT=8003 ;;
              *)    echo "No site is deployed from branch $BRANCH"; exit 1 ;;
            esac
            echo "==> Deploying $BRANCH to $APP_DIR"
            cd "$APP_DIR"

            echo "==> Pull latest code"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            echo "==> Backend: composer + migrate + cache"
            # The Laravel API. Its .env lives only on the server (never in git).
            cd "$APP_DIR/backend"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            grep -q "^APP_KEY=base64" .env || php artisan key:generate --force
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache

            echo "==> Restart the API via PM2 (start it if not running yet)"
            # nginx sends /api to this port; 8000 and 8001 are the other sites'.
            pm2 restart "$API" --update-env \
              || pm2 start artisan --name "$API" --interpreter php -- serve --host=127.0.0.1 --port="$PORT"
            pm2 save

            echo "==> Frontend: build"
            cd "$APP_DIR/frontend"
            # npm install (not ci): rolldown-vite pulls platform-specific native
            # deps, so the macOS-generated lock file doesn't satisfy npm ci here.
            npm install --no-audit --no-fund
            npm run build

            echo "==> Publish"
            # Swap in the new build in one move, so nginx never serves a half-copied folder.
            rm -rf "$APP_DIR/dist.new"
            cp -r dist "$APP_DIR/dist.new"
            rm -rf "$APP_DIR/dist.old"
            if [ -d "$APP_DIR/dist" ]; then mv "$APP_DIR/dist" "$APP_DIR/dist.old"; fi
            mv "$APP_DIR/dist.new" "$APP_DIR/dist"
            rm -rf "$APP_DIR/dist.old"

            echo "==> Deploy complete"
