name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Everything is built ON THE SERVER, from its own clone of the repo:
      # nginx serves /var/www/elpnew/dist and sends /api to the Laravel API
      # (PM2, port 8002) - so this is a single SSH step.
      # The React app lives in frontend/ (the Laravel API in backend/); the
      # build is copied back to /var/www/elpnew/dist so nginx is unchanged.
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/elpnew

            echo "==> Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "==> Backend: composer + migrate + cache"
            # The Laravel API. Its .env lives only on the server (never in git).
            cd /var/www/elpnew/backend
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            grep -q "^APP_KEY=base64" .env || php artisan key:generate --force
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache

            echo "==> Restart the API via PM2 (start it if not running yet)"
            # nginx sends /api to this port; 8000 and 8001 are the other sites'.
            pm2 restart elpnew-api --update-env \
              || pm2 start artisan --name elpnew-api --interpreter php -- serve --host=127.0.0.1 --port=8002
            pm2 save

            echo "==> Frontend: build"
            cd /var/www/elpnew/frontend
            # npm install (not ci): rolldown-vite pulls platform-specific native
            # deps, so the macOS-generated lock file doesn't satisfy npm ci here.
            npm install --no-audit --no-fund
            npm run build

            echo "==> Publish"
            # Swap in the new build in one move, so nginx never serves a half-copied folder.
            rm -rf /var/www/elpnew/dist.new
            cp -r dist /var/www/elpnew/dist.new
            rm -rf /var/www/elpnew/dist.old
            if [ -d /var/www/elpnew/dist ]; then mv /var/www/elpnew/dist /var/www/elpnew/dist.old; fi
            mv /var/www/elpnew/dist.new /var/www/elpnew/dist
            rm -rf /var/www/elpnew/dist.old

            echo "==> Deploy complete"
