<!doctype html>
<!-- en-GB, not en-US: it is what makes the browser's own date fields read and
     accept dates as DD/MM/YYYY, which is how they are written here. -->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      IBM Plex Sans Arabic carries the whole interface: 400 for values and
      table data, 500 for labels and buttons, 600 for titles and active
      elements, 700 only where something must shout.

      The files are served from this application, not a CDN - see the
      @font-face block in src/index.css. Preloaded here in the two weights
      every page uses first, so text is not painted twice.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/IBMPlexSansArabic-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/IBMPlexSansArabic-500-latin.woff2"
      crossorigin
    />
    <title>yands</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
